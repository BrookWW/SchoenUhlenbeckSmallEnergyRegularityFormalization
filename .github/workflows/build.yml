name: Build and verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lean-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lean build and theorem checks
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      LEAN_NUM_THREADS: "2"
    steps:
      - name: Check out sources
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Free runner disk space
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${RUNNER_ENVIRONMENT:-}" == github-hosted ]]; then
            sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
            sudo docker image prune --all --force > /dev/null || true
          fi
          df -h .

      - name: Build all Lean modules
        uses: leanprover/lean-action@f061402b660e0c34644504b324e830f2991d4865 # v1
        with:
          auto-config: "false"
          build: "true"
          use-mathlib-cache: "true"
          use-github-cache: "true"

      - name: Check theorem axioms
        run: python3 scripts/check_axioms.py

      - name: Check theorem statement types
        run: python3 scripts/check_statements.py

      - name: Check pinned dependency files
        run: git diff --exit-code -- lean-toolchain lakefile.toml lake-manifest.json
